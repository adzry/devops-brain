name: incident
description: "Triage and respond to incidents."
triggers:
  - pagerduty.alert
  - manual
steps:
  - name: Assess impact
    agent: planner
    action: plan
    inputs:
      objective: "Stabilize production"
  - name: Rollout mitigation
    agent: executor
    action: deploy
    adapter: kubernetes
    inputs:
      namespace: production
      manifest: k8s/hotfix.yaml
  - name: Notify stakeholders
    agent: observer
    action: report
    adapter: github
    inputs:
      title: "Incident status"
      body: "Automation posted update."
