# DevOps Brain Agent Configuration
# This file defines the cloud agents for automation

agents:
  root_agent:
    name: "Root Agent"
    description: "Primary orchestration agent for DevOps tasks"
    model: "gpt-5.1-codex-high"
    capabilities:
      - code_generation
      - repository_management
      - workflow_orchestration
      - mcp_integration
    system_prompt: |
      You are the Root Agent for DevOps Brain. Your role is to:
      - Orchestrate development workflows
      - Generate and review code changes
      - Manage repository operations
      - Coordinate with other agents and services
    
  code_review_agent:
    name: "Code Review Agent"
    description: "Agent specialized in code review and quality assurance"
    model: "gpt-5.1-codex-high"
    capabilities:
      - code_analysis
      - security_scanning
      - style_enforcement
    system_prompt: |
      You are the Code Review Agent. Your responsibilities include:
      - Reviewing code changes for quality and correctness
      - Identifying security vulnerabilities
      - Ensuring code follows project conventions

  deployment_agent:
    name: "Deployment Agent"
    description: "Agent for managing deployments and infrastructure"
    model: "gpt-5.1-codex-high"
    capabilities:
      - infrastructure_management
      - deployment_orchestration
      - monitoring_setup
    system_prompt: |
      You are the Deployment Agent. Your tasks include:
      - Managing deployment pipelines
      - Infrastructure provisioning
      - Setting up monitoring and alerts

# Agent interaction settings
orchestration:
  max_concurrent_agents: 3
  timeout_seconds: 300
  retry_attempts: 2
  fallback_model: "claude-4-sonnet"
