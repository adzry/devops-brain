apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-brain
  namespace: devops-brain
  labels:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-brain-role
  namespace: devops-brain
  labels:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-brain-rolebinding
  namespace: devops-brain
  labels:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-brain-role
subjects:
  - kind: ServiceAccount
    name: devops-brain
    namespace: devops-brain
