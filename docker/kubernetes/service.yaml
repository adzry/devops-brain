apiVersion: v1
kind: Service
metadata:
  name: devops-brain-api
  namespace: devops-brain
  labels:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: devops-brain-api-headless
  namespace: devops-brain
  labels:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: api
