apiVersion: v1
kind: Secret
metadata:
  name: devops-brain-secrets
  namespace: devops-brain
  labels:
    app.kubernetes.io/name: devops-brain
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace with actual secrets in production
  # Use external secrets manager like AWS Secrets Manager, Vault, etc.
  DATABASE_URL: "postgresql://user:password@postgres:5432/devops_brain"
  REDIS_URL: "redis://redis:6379/0"
  GITHUB_TOKEN: "your-github-token"
  SLACK_BOT_TOKEN: "your-slack-token"
